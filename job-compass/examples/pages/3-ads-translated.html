  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.0625rem;
  line-height: 1.55;
  overflow-wrap: break-word;
}
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--accent); text-underline-offset: 0.15em; }

.wrap {
  max-width: 40rem;
  margin-inline: auto;
  padding-inline: 1rem;
  padding-block: 2rem 4rem;
  display: flex;
  flex-direction: column;
  gap: 1.6rem;
}
@media (min-width: 480px) { .wrap { padding-inline: 1.25rem; } }
.wrap p, .wrap h1, .wrap h2, .wrap ul, .wrap ol, .wrap dl, .wrap dd { margin: 0; }
.stack { display: flex; flex-direction: column; gap: 0.6rem; }
.waiting { color: var(--muted); }

/* headings */
.eyebrow {
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--accent);
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.6rem, 5.8vw, 2.25rem);
  line-height: 1.12;
  text-wrap: balance;
}
h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(1.15rem, 4.4vw, 1.4rem);
  line-height: 1.2;
  text-wrap: balance;
  display: flex;
  gap: 0.6rem;
  align-items: baseline;
}
h1:focus, h2:focus { outline: none; }
h2 .num {
  flex: none;
  font-family: var(--font-body);
  font-size: 0.85rem;
  width: 1.6rem;
  height: 1.6rem;
  border-radius: 50%;
  background: var(--ink);
  color: var(--bg);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-variant-numeric: tabular-nums;
}
.lede { color: var(--muted); max-width: 34rem; }
.hint { color: var(--muted); font-size: 0.95rem; }
.fine { color: var(--muted); font-size: 0.9rem; }
.note {
  background: var(--accent-soft);
  border-radius: 0.75rem;
  padding: 0.85rem 1rem;
  font-size: 0.98rem;
}
.rule { background: var(--accent-soft); border-radius: 0.75rem; padding: 0.9rem 1rem; }
.rule strong { display: block; }
hr { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* progress */
.count { font-size: 0.9rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.trail { display: grid; gap: 4px; }
.seg { height: 6px; border-radius: 3px; background: var(--line); }
.seg.done { background: var(--accent); }
.seg.skip { background: repeating-linear-gradient(90deg, var(--muted) 0 3px, transparent 3px 6px); }
.seg.now { background: var(--ink); }

/* buttons */
.btn, a.btn {
  font: inherit;
  font-weight: 700;
  border-radius: 0.65rem;
  padding: 0.7rem 1.1rem;
  border: 1.5px solid var(--accent);
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
  text-decoration: none;
  display: inline-block;
  text-align: center;
}
.btn.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.quiet:hover { border-color: var(--accent); }
.btn.quiet[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn.small { padding: 0.45rem 0.85rem; font-size: 0.95rem; }
.btn:disabled { opacity: 0.45; cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 0.625rem; justify-content: space-between; align-items: center; }
.row.start { justify-content: flex-start; }

/* chips */
.facts, .chips { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 0.4rem; }
.facts li, .chips li {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.2rem 0.7rem;
  font-size: 0.93rem;
  background: var(--surface);
}

/* choice cards: quiz options, tasks, kinds of work */
.opts, .tasks, .cands { display: grid; gap: 0.55rem; }
.opt, .task {
  display: flex;
  gap: 0.75rem;
  align-items: flex-start;
  width: 100%;
  min-width: 0;
  text-align: left;
  font: inherit;
  color: inherit;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 0.75rem;
  padding: 0.85rem 0.95rem;
  cursor: pointer;
}
.opt:hover, .task:hover { border-color: var(--accent); }
.opt[aria-pressed="true"], .task[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.task[aria-disabled="true"] { opacity: 0.55; cursor: default; }
.task[aria-disabled="true"]:hover { border-color: var(--line); }
.opt .dot {
  flex: none;
  width: 1.15rem;
  height: 1.15rem;
  margin-top: 0.2rem;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
}
.opt[aria-pressed="true"] .dot {
  border-color: var(--accent);
  background: var(--accent);
  box-shadow: inset 0 0 0 3px var(--accent-soft);
}
.task .box {
  flex: none;
  width: 1.2rem;
  height: 1.2rem;
  margin-top: 0.18rem;
  border-radius: 0.3rem;
  border: 1.5px solid var(--muted);
  position: relative;
}
.task[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent); }
.task[aria-pressed="true"] .box::after {
  content: "";
  position: absolute;
  left: 0.32rem;
  top: 0.08rem;
  width: 0.32rem;
  height: 0.62rem;
  border-right: 2px solid var(--accent-ink);
  border-bottom: 2px solid var(--accent-ink);
  transform: rotate(45deg);
}
.opt .txt, .task .txt { min-width: 0; }

/* kinds of work to keep or cross out */
.cand {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 0.8rem;
  padding: 0.9rem 0.95rem;
  display: grid;
  gap: 0.6rem;
}
.cand .name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; line-height: 1.2; }
.cand.out { background: transparent; border-style: dashed; }
.cand.out .name, .cand.out .day { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
.cand .row { justify-content: flex-start; }
.tally { font-variant-numeric: tabular-nums; }
textarea.free {
  width: 100%;
  min-height: 5.5rem;
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 0.65rem;
  padding: 0.7rem 0.8rem;
}

/* quiz results */
.dirs { display: grid; gap: 0.75rem; }
.dir { background: var(--surface); border: 1.5px solid var(--line); border-radius: 0.875rem; }
.dir.top { border-color: var(--mark); }
.dir summary {
  cursor: pointer;
  list-style: none;
  padding: 1rem;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 0.5rem 0.75rem;
  align-items: center;
  border-radius: 0.8rem;
}
.dir summary::-webkit-details-marker { display: none; }
.dir .name { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; line-height: 1.2; min-width: 0; }
.badge {
  display: inline-block;
  margin-bottom: 0.3rem;
  background: var(--mark);
  color: var(--mark-ink);
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border-radius: 0.35rem;
  padding: 0.12rem 0.45rem;
}
.dir .score { font-size: 0.9rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.dir .chev {
  width: 0.6rem;
  height: 0.6rem;
  border-right: 2px solid var(--muted);
  border-bottom: 2px solid var(--muted);
  transform: rotate(45deg);
  margin: 0 0.2rem 0.2rem;
  transition: transform 0.15s;
}
.dir[open] .chev { transform: rotate(-135deg); margin-bottom: -0.2rem; }
.bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.dir .bar { grid-column: 1 / -1; }
.dir .body { display: grid; gap: 0.95rem; padding: 1rem; border-top: 1px solid var(--line); }
.lab {
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 0.25rem;
}
.where { color: var(--muted); font-size: 0.93rem; margin-top: 0.45rem; }
ul.titles { list-style: none; padding: 0; display: grid; gap: 0.5rem; }
ul.titles li { border-left: 3px solid var(--line); padding-left: 0.75rem; display: grid; gap: 0.05rem; }
ul.titles li span { color: var(--muted); font-size: 0.93rem; }
.searchbox { background: var(--surface); border: 1.5px solid var(--mark); border-radius: 0.875rem; padding: 1rem; }
.searchbox ul.chips li { background: var(--bg); }

/* job pages */
.called, .at { color: var(--muted); font-size: 0.98rem; }
.called b { color: var(--ink); }
.short { border-left: 3px solid var(--mark); padding-left: 0.85rem; }
.know { padding-left: 1.15rem; display: grid; gap: 0.4rem; }
.sub { font-weight: 700; }
.plain { display: grid; gap: 1.1rem; }

dl.words { display: grid; gap: 0.75rem; }
dl.words div { border-left: 3px solid var(--line); padding-left: 0.85rem; }
dl.words dt { font-weight: 700; }

.signals { display: grid; gap: 0.6rem; }
.signals div { border-left: 3px solid var(--line); padding-left: 0.85rem; }
.signals b { display: block; }
.signalbox { background: var(--surface); border: 1.5px solid var(--line); border-radius: 0.75rem; padding: 0.9rem 1rem; display: grid; gap: 0.6rem; }

.asks { list-style: none; padding: 0; display: grid; gap: 0.75rem; }
.asks li {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 0.75rem;
  padding: 0.85rem 0.95rem;
  display: grid;
  gap: 0.35rem;
}
.asks li.have { border-color: var(--mark); }
.tag {
  justify-self: start;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  border-radius: 0.35rem;
  padding: 0.12rem 0.45rem;
  border: 1px solid var(--line);
  color: var(--muted);
}
.tag.have { background: var(--mark); color: var(--mark-ink); border-color: var(--mark); }
.tag.must { color: var(--ink); border-color: var(--ink); }
.wrote { font-style: italic; }
.asks .why { color: var(--muted); font-size: 0.97rem; }
.signal { font-size: 0.93rem; }
.signal b { font-style: normal; }

/* explain-on-tap words */
div.words { display: grid; gap: 0.5rem; }
.word { background: var(--surface); border: 1.5px solid var(--line); border-radius: 0.75rem; }
.word.open { border-color: var(--accent); }
.word button {
  width: 100%;
  min-width: 0;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 0.75rem;
  text-align: left;
  font: inherit;
  font-weight: 700;
  color: inherit;
  background: none;
  border: 0;
  border-radius: 0.7rem;
  padding: 0.7rem 0.95rem;
  cursor: pointer;
}
.word button .q { flex: none; color: var(--muted); font-weight: 400; font-size: 0.9rem; }
.word.open button { cursor: default; }
.word.open button .q { display: none; }
.word .mean { padding: 0 0.95rem 0.8rem; }

/* must or wish */
.lines { display: grid; gap: 0.75rem; }
.linecard {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 0.75rem;
  padding: 0.85rem 0.95rem;
  display: grid;
  gap: 0.6rem;
}
.linecard .pick { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.linecard .fb { border-top: 1px solid var(--line); padding-top: 0.6rem; }
.linecard .fb b { display: block; }

.react { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.react .btn { flex: 1 1 9rem; }

/* summaries */
.sum { list-style: none; padding: 0; display: grid; gap: 0.6rem; }
.sum li {
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 0.75rem;
  padding: 0.8rem 0.95rem;
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem 0.75rem;
  justify-content: space-between;
  align-items: baseline;
}
.sum .what { font-weight: 700; min-width: 0; flex: 1 1 14rem; }
.sum .said { color: var(--muted); white-space: nowrap; }
.sum li.yes { border-color: var(--mark); }
.sum li.yes .said { color: var(--ink); font-weight: 700; }
.kinds { display: grid; gap: 0.65rem; }
.kind { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.3rem 0.75rem; align-items: baseline; }
.kind .n { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.kind .bar { grid-column: 1 / -1; }
.picked { padding-left: 1.15rem; display: grid; gap: 0.3rem; }

#copy-fallback {
  width: 100%;
  min-height: 11rem;
  font: inherit;
  font-size: 0.95rem;
  color: var(--ink);
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 0.65rem;
  padding: 0.75rem;
}
@media (prefers-reduced-motion: reduce) { .dir .chev { transition: none; } }
@media print {
  .row, .react, #copy-fallback { display: none !important; }
  .dir .body { display: grid !important; }
}

<script>
/* Job Compass shared page code.
   Every page gets: window.JC_DATA (the content Claude wrote), window.JC_STRINGS (page text),
   and this file. The page template then calls JC.boot(start). Nothing here talks to a server;
   progress stays in this browser's storage. */
var JC = (function () {
  'use strict';

  var DATA = window.JC_DATA || {};
  var S = window.JC_STRINGS || {};

  // ---- text -------------------------------------------------------------
  function lookup(key) {
    var parts = key.split('.'), v = S;
    for (var i = 0; i < parts.length; i++) {
      if (v == null || typeof v !== 'object') return null;
      v = v[parts[i]];
    }
    return v;
  }
  // t('quiz.count', {n: 3, total: 14}). Values may be {one, other} for plurals.
  function t(key, vars) {
    var v = lookup(key);
    if (v == null) { try { console.warn('Missing text: ' + key); } catch (e) {} return key; }
    if (typeof v === 'object' && !Array.isArray(v)) v = (vars && vars.n === 1) ? v.one : v.other;
    if (Array.isArray(v)) return v;
    return String(v).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : m;
    });
  }

  // Quotation marks come from the page text, so a translation can use its own („…“ in German).
  function q(s) { return t('common.quoteOpen') + s + t('common.quoteClose'); }

  function niceDate(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T12:00:00Z');
    if (isNaN(d)) return iso;
    try {
      return d.toLocaleDateString(t('meta.locale'), { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    } catch (e) { return iso; }
  }

  // ---- DOM --------------------------------------------------------------
  function h(tag, props) {
    var n = document.createElement(tag), k, v, i, c;
    if (props) for (k in props) {
      v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k === 'style') n.setAttribute('style', v);
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (i = 2; i < arguments.length; i++) {
      c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function (x) { if (x != null && x !== false) n.append(x); });
      else n.append(c);
    }
    return n;
  }

  function section(title, hint) {
    var s = h('section', { class: 'stack' }, h('h2', null, h('span', { text: title })), hint && h('p', { class: 'hint', text: hint }));
    for (var i = 2; i < arguments.length; i++) if (arguments[i]) s.append(arguments[i]);
    return s;
  }

  function step(num, title, hint) {
    var s = h('section', { class: 'stack' },
      h('h2', null, num && h('span', { class: 'num', 'aria-hidden': 'true', text: String(num) }), h('span', { text: title })),
      hint && h('p', { class: 'hint', text: hint }));
    for (var i = 3; i < arguments.length; i++) if (arguments[i]) s.append(arguments[i]);
    return s;
  }

  function focusTitle(scroll) {
    if (scroll !== false) window.scrollTo(0, 0);
    var el = document.getElementById('focus-title');
    if (el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  }

  // ---- storage ----------------------------------------------------------
  // Each built page has its own pageId, so two people's pages on one device never mix.
  function store(name, valid) {
    var key = 'job-compass:' + name + ':' + (DATA.pageId || 'page');
    return {
      load: function () {
        try { var s = JSON.parse(localStorage.getItem(key) || 'null'); return valid(s) ? s : null; } catch (e) { return null; }
      },
      save: function (state) { try { localStorage.setItem(key, JSON.stringify(state)); } catch (e) {} },
      clear: function () { try { localStorage.removeItem(key); } catch (e) {} }
    };
  }

  function isIndexList(l, max) {
    return Array.isArray(l) && l.every(function (n, i) { return typeof n === 'number' && n % 1 === 0 && n >= 0 && n < max && l.indexOf(n) === i; });
  }

  // ---- pieces -----------------------------------------------------------
  function trail(label, total, current, stateOf) {
    var bar = h('div', { class: 'trail', role: 'img', 'aria-label': label, style: 'grid-template-columns:repeat(' + total + ',1fr)' });
    for (var n = 0; n < total; n++) {
      var st = n === current ? 'now' : stateOf(n);
      bar.append(h('span', { class: 'seg' + (st ? ' ' + st : '') }));
    }
    return h('div', { class: 'stack' }, h('p', { class: 'count', text: label }), bar);
  }

  // Up to `max` picks from a list of task texts. selected is an array of indexes, changed in place.
  function picker(idPrefix, texts, selected, max, onChange) {
    var list = h('div', { class: 'tasks' });
    var status = h('p', { class: 'hint', role: 'status' });
    var buttons = [];
    function paint() {
      var full = selected.length >= max;
      buttons.forEach(function (b, n) {
        var on = selected.indexOf(n) !== -1;
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        if (full && !on) b.setAttribute('aria-disabled', 'true'); else b.removeAttribute('aria-disabled');
      });
      status.textContent = full ? t('common.pickFull', { max: max }) : '';
    }
    texts.forEach(function (txt, n) {
      var b = h('button', { type: 'button', class: 'task', id: idPrefix + '-' + n, onclick: function () {
        var at = selected.indexOf(n);
        if (at !== -1) selected.splice(at, 1);
        else if (selected.length < max) selected.push(n);
        else return;
        paint();
        onChange();
      } }, h('span', { class: 'box', 'aria-hidden': 'true' }), h('span', { class: 'txt', text: txt }));
      buttons.push(b);
      list.append(b);
    });
    paint();
    return h('div', { class: 'stack' }, list, status);
  }

  // Three buttons: I'd like this / Not sure / No thanks. Tapping the chosen one again clears it.
  function reactions(idPrefix, current, onChange) {
    var box = h('div', { class: 'react' });
    var opts = ['yes', 'maybe', 'no'];
    opts.forEach(function (k) {
      box.append(h('button', { type: 'button', class: 'btn quiet', id: idPrefix + '-' + k,
        'aria-pressed': current() === k ? 'true' : 'false',
        onclick: function () {
          var next = current() === k ? null : k;
          onChange(next);
          Array.prototype.forEach.call(box.children, function (c) {
            c.setAttribute('aria-pressed', c.id === idPrefix + '-' + next ? 'true' : 'false');
          });
        } }, t('common.react.' + k)));
    });
    return box;
  }

  // Copy button with a manual fallback, plus "look again" and "start again" with a confirm step.
  function copyPanel(o) {
    var status = h('p', { class: 'fine', id: 'copy-status', role: 'status' });
    var fallback = h('textarea', { id: 'copy-fallback', readonly: true, hidden: true, 'aria-label': t('common.copyFallbackLabel') });
    var confirmRow = h('div', { class: 'row start', id: 'reset-confirm', hidden: true },
      h('span', { text: o.resetQuestion }),
      h('button', { type: 'button', class: 'btn', id: 'btn-reset-yes', onclick: o.onReset }, t('common.resetYes')),
      h('button', { type: 'button', class: 'btn quiet', id: 'btn-reset-no', onclick: function () { confirmRow.hidden = true; } }, t('common.resetNo')));
    function copy() {
      var text = o.getText();
      function manual() {
        fallback.hidden = false;
        fallback.value = text;
        fallback.focus();
        fallback.select();
        status.textContent = t('common.copyBlocked');
      }
      try {
        navigator.clipboard.writeText(text).then(function () {
          status.textContent = t('common.copied');
          fallback.value = text;
        }, manual);
      } catch (e) { manual(); }
    }
    return h('div', { class: 'stack' },
      h('div', { class: 'row start' },
        h('button', { type: 'button', class: 'btn', id: 'btn-copy', onclick: copy }, o.copyLabel),
        o.reviewLabel && h('button', { type: 'button', class: 'btn quiet', id: 'btn-review', onclick: o.onReview }, o.reviewLabel),
        h('button', { type: 'button', class: 'btn quiet', id: 'btn-reset', onclick: function () { confirmRow.hidden = false; } }, t('common.startAgain'))),
      confirmRow, status, fallback);
  }

  function bars(rows) {
    // rows: [{label, n}] already sorted. Only used for counts of the person's own picks.
    var max = Math.max.apply(null, rows.map(function (r) { return r.n; }).concat([1]));
    var box = h('div', { class: 'kinds' });
    rows.forEach(function (r) {
      box.append(h('div', { class: 'kind' },
        h('span', { text: r.label }),
        h('span', { class: 'n', text: r.count }),
        h('span', { class: 'bar', 'aria-hidden': 'true' }, h('i', { style: 'width:' + Math.round(r.n / max * 100) + '%' }))));
    });
    return box;
  }

  function header(lines) {
    // First line of every copied text names the page, so Claude knows what it is reading.
    return [t('common.copyHeader', { page: lines })];
  }

  // ---- start --------------------------------------------------------------
  function boot(start) {
    var app = document.getElementById('app');
    try { document.documentElement.lang = t('meta.lang'); } catch (e) {}
    if (DATA.title) document.title = DATA.title;
    var hot = window.claude && window.claude.hot;
    function go(saved) {
      app.textContent = '';
      start(app, saved || null);
    }
    try {
      if (hot && hot.ready) { hot.ready(go); return; }
    } catch (e) {}
    go((hot && hot.data) || null);
  }

  return {
    DATA: DATA, t: t, q: q, get: lookup, h: h, section: section, step: step, focusTitle: focusTitle, store: store,
    isIndexList: isIndexList, trail: trail, picker: picker, reactions: reactions, copyPanel: copyPanel,
    bars: bars, header: header, niceDate: niceDate, boot: boot
  };
})();

</script>
<script>
/* Step 3: three real ads, translated.
   Each job gets a plain title, a short picture, a week of tasks (pick up to three),
   a word list, and the requirements with must / wish marked and the signal word named. */
(function () {
  'use strict';
  var t = JC.t, h = JC.h, D = JC.DATA;
  var JOBS = D.jobs;
  var MAX = D.pickMax || 3;
  // The invitation to look for the deciding word in the original ad is shown once, on the first job it fits.
  var FIRST_FIND = -1;
  JOBS.some(function (j, n) { if (j.unchecked && j.link) { FIRST_FIND = n; return true; } return false; });

  function fresh() {
    var s = { pos: 0, picks: {}, react: {} };
    JOBS.forEach(function (j) { s.picks[j.id] = []; s.react[j.id] = null; });
    return s;
  }
  function valid(s) {
    if (!s || typeof s.pos !== 'number' || s.pos % 1 !== 0 || s.pos < 0 || s.pos > JOBS.length) return false;
    if (!s.picks || !s.react) return false;
    return JOBS.every(function (j) {
      var r = s.react[j.id];
      return JC.isIndexList(s.picks[j.id], j.week.length) && s.picks[j.id].length <= MAX &&
        (r === null || r === 'yes' || r === 'maybe' || r === 'no');
    });
  }
  var store = JC.store('ads-translated', valid);
  var state = fresh();
  var app;

  function go(pos) { state.pos = pos; render(); JC.focusTitle(); }
  function render() {
    app.textContent = '';
    if (state.pos >= JOBS.length) renderSummary(); else renderJob();
    store.save(state);
  }

  function signalBox(open) {
    var list = h('div', { class: 'signals' });
    ['wish', 'must', 'small', 'neither'].forEach(function (k) {
      list.append(h('div', null, h('b', { text: t('signals.' + k + '.label') }), t('signals.' + k + '.words')));
    });
    return h('details', { class: 'signalbox', open: open },
      h('summary', null, h('b', { text: t('signals.title') })),
      h('p', { class: 'hint', text: t('signals.intro') }),
      list,
      JC.get('meta.signalsChecked') === false && h('p', { class: 'hint', text: t('signals.uncheckedNote') }));
  }

  function renderJob() {
    var i = state.pos, job = JOBS[i];

    if (i === 0) {
      app.append(h('div', { class: 'rule' }, h('strong', { text: t('common.nobodyApplying') }),
        JOBS.every(function (j) { return j.words && j.words.length; }) ? t('ads1.ruleText') : t('ads1.ruleTextNoWords')));
    }
    app.append(JC.trail(t('common.jobCount', { i: i + 1, total: JOBS.length }), JOBS.length, i, function (n) {
      return state.react[JOBS[n].id] ? 'done' : '';
    }));

    var facts = h('ul', { class: 'facts' });
    job.facts.forEach(function (f) { facts.append(h('li', { text: f })); });
    if (job.unchecked) facts.append(h('li', { text: t('ads1.uncheckedChip') }));
    app.append(h('header', { class: 'stack' },
      h('p', { class: 'eyebrow', text: t('ads1.eyebrow') }),
      h('h1', { id: 'focus-title', tabindex: '-1', text: job.plain }),
      h('p', { class: 'called' }, t('ads1.calledPre'), h('b', { text: job.title }), t('ads1.calledPost', { employer: job.employer })),
      facts,
      h('p', { class: 'short', text: job.short })));

    app.append(JC.section(t('ads1.weekTitle'), t('common.pickHint', { max: MAX }),
      JC.picker('task-' + job.id, job.week.map(function (w) { return w[1]; }), state.picks[job.id], MAX, function () { store.save(state); })));

    if (job.words && job.words.length) {
      var words = h('dl', { class: 'words' });
      job.words.forEach(function (w) { words.append(h('div', null, h('dt', { text: w[0] }), h('dd', { text: w[1] }))); });
      app.append(JC.section(t('ads1.wordsTitle'), t('ads1.wordsHint'), words));
    }

    var asks = h('ul', { class: 'asks' });
    job.asks.forEach(function (a) {
      asks.append(h('li', { class: a.have ? 'have' : null },
        h('div', { class: 'row start' },
          h('span', { class: 'tag ' + a.tag, text: job.unchecked ? t('tagsProbably.' + a.tag) : t('tags.' + a.tag) }),
          a.have && h('span', { class: 'tag have', text: t('tags.have') })),
        a.wrote ? h('p', { class: 'wrote', text: JC.q(a.wrote) }) : h('p', { text: a.text }),
        a.signal ? h('p', { class: 'signal' }, t('ads1.signalPre'), h('b', { text: JC.q(a.signal) })) : null,
        h('p', { class: 'why', text: a.why })));
    });
    app.append(JC.section(t('ads1.asksTitle'), job.unchecked ? t('ads1.asksHintUnchecked') : t('ads1.asksHint'), signalBox(i === 0), asks,
      job.unchecked && job.link && i === FIRST_FIND && h('p', { class: 'note', text: t('ads1.findWordPrompt') })));

    var know = h('ul', { class: 'know' });
    job.know.forEach(function (k) { know.append(h('li', { text: k })); });
    app.append(JC.section(t('ads1.knowTitle'), null, know,
      job.link && h('p', null, h('a', { href: job.link, target: '_blank', rel: 'noopener', text: t('ads1.readOriginal') }), t('ads1.readOriginalPost'))));

    app.append(h('hr'));
    app.append(JC.section(t('common.reactTitle'), t('common.reactHint'),
      JC.reactions('react-' + job.id, function () { return state.react[job.id]; }, function (v) { state.react[job.id] = v; store.save(state); })));

    app.append(h('div', { class: 'row' },
      h('button', { type: 'button', class: 'btn quiet', id: 'btn-back', disabled: i === 0, onclick: function () { go(i - 1); } }, t('common.back')),
      h('button', { type: 'button', class: 'btn', id: 'btn-next', onclick: function () { go(i + 1); } },
        i === JOBS.length - 1 ? t('common.seeWhatIThought') : t('common.nextJob'))));
  }

  function tally() {
    var counts = {}, picked = [], kinds = [];
    JOBS.forEach(function (j) {
      j.week.forEach(function (w) { if (kinds.indexOf(w[0]) === -1) kinds.push(w[0]); });
      state.picks[j.id].slice().sort(function (a, b) { return a - b; }).forEach(function (n) {
        counts[j.week[n][0]] = (counts[j.week[n][0]] || 0) + 1;
        picked.push(j.week[n][1]);
      });
    });
    return { counts: counts, picked: picked, kinds: kinds };
  }

  function resultText(tl) {
    var lines = JC.header(t('ads1.copyName'));
    lines.push('');
    JOBS.forEach(function (j, n) {
      lines.push((n + 1) + '. ' + j.title + ' (' + j.employer + '): ' + (state.react[j.id] ? t('common.react.' + state.react[j.id]) : t('common.noAnswer')));
    });
    lines.push('');
    lines.push(t('common.copyKinds'));
    tl.kinds.slice().sort(function (a, b) { return (tl.counts[b] || 0) - (tl.counts[a] || 0); })
      .forEach(function (k) { lines.push('- ' + t('kinds.' + k) + ': ' + (tl.counts[k] || 0)); });
    if (tl.picked.length) {
      lines.push('');
      lines.push(t('common.copyPicked'));
      tl.picked.forEach(function (p) { lines.push('- ' + p); });
    }
    return lines.join('\n');
  }

  function renderSummary() {
    var tl = tally();
    var anyYes = JOBS.some(function (j) { return state.react[j.id] === 'yes'; });
    var likedHaveWords = JOBS.some(function (j) { return state.react[j.id] === 'yes' && j.words && j.words.length; });

    app.append(h('header', { class: 'stack' },
      h('p', { class: 'eyebrow', text: t('ads1.summaryEyebrow') }),
      h('h1', { id: 'focus-title', tabindex: '-1', text: t('common.whatYouThought') }),
      h('p', { class: 'lede', text: t('ads1.summaryLede', { n: JOBS.length }) })));


    var sum = h('ul', { class: 'sum' });
    JOBS.forEach(function (j) {
      var r = state.react[j.id];
      sum.append(h('li', { class: r === 'yes' ? 'yes' : null },
        h('span', { class: 'what', text: j.plain }),
        h('span', { class: 'said', text: r ? t('common.react.' + r) : t('common.noAnswerYet') })));
    });
    app.append(JC.section(t('ads1.summaryJobs', { n: JOBS.length }), null, sum));

    if (!tl.picked.length) {
      app.append(JC.section(t('common.kindsTitle'), null, h('p', { text: t('common.noPicks') })));
    } else {
      var rows = tl.kinds.map(function (k) { var n = tl.counts[k] || 0; return { label: t('kinds.' + k), n: n, count: t('common.tasksN', { n: n }) }; })
        .sort(function (a, b) { return b.n - a.n; });
      var picked = h('ul', { class: 'picked' });
      tl.picked.forEach(function (p) { picked.append(h('li', { text: p })); });
      app.append(JC.section(t('common.kindsTitle'), t('common.kindsHint'), JC.bars(rows)));
      app.append(JC.section(t('common.pickedTitle'), null, picked));
    }

    app.append(JC.section(t('common.nextStepTitle'), null, h('p', { text: anyYes ? (likedHaveWords ? t('ads1.nextYes') : t('ads1.nextYesNoWords')) : t('ads1.nextNone') })));

    app.append(JC.copyPanel({
      copyLabel: t('common.copyWhatIThought'),
      getText: function () { return resultText(tally()); },
      reviewLabel: t('common.lookAgain'),
      onReview: function () { go(0); },
      resetQuestion: t('common.resetJobsQuestion'),
      onReset: function () { state = fresh(); store.clear(); go(0); }
    }));
    app.append(h('p', { class: 'fine', text: t('common.adsFooter', { date: JC.niceDate(D.checked) }) }));
  }

  JC.boot(function (root, saved) {
    app = root;
    var s = valid(saved) ? saved : store.load();
    if (s) state = JSON.parse(JSON.stringify(s));
    render();
  });
})();

</script>
</body>
</html>
